version: '3.8'
services:
  backend:
    image: backend-image
    container_name: backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - my_network

  frontend:
    image: frontend-image
    container_name: frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - my_network
    environment:
      - REACT_APP_BACKEND_URL=http://backend-container:5000

networks:
  my_network:
    driver: bridge
